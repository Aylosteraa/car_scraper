services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: auto_db
      POSTGRES_USER: auto_user
      POSTGRES_PASSWORD: auto_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data

  scraper:
    build: .
    env_file:
      - .env
    depends_on:
      - db

  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - ./dumps:/app/dumps

volumes:
  postgres_data:
